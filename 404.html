<!DOCTYPE html>

<head>

*{box-sizing:border-box}
body{margin:0;background:#fff;color:#1d2321;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.7}

<main>

<div class="go">
<a href="/rentals.html"><b>🏠 看在租房源</b><span>墨尔本中文租房，带地图、学区和通勤时间</span></a>

<script>
(function () {
  var p = location.pathname, h = document.getElementById("hint"), m;
  if ((m = p.match(/\/rent\/([^\/]+?)(\.html)?$/))) {
    h.innerHTML = '这套房源可能已经租出了。<a href="/rentals.html">看看现在还在租的房源 →</a>';
    h.style.display = "block";
  } else if (/\/guide\//.test(p)) {
    h.innerHTML = '文章地址可能改过了。<a href="/guide/property.html">到房产干货目录里找找 →</a>';
    h.style.display = "block";
  }
})();
</script>
<script src="/js/config.js"></script>
