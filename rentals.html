<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>好租 Howzu · 墨尔本在租房源</title>
<meta name="description" content="好租 Howzu 墨尔本在租房源：CBD、Carlton 公寓，房东直租管理，中文服务。每套房一键查对口学区。">
<link rel="stylesheet" href="css/site.css">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2321;--muted:#6b726f;--line:#e4e1d8;--accent:#0f6b4f;--accent2:#e8f3ee;--warn:#9a5b00;--warnbg:#fff6e5}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
main{max-width:1240px;margin:0 auto;padding:22px 20px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
#list .card{margin:0;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
#list .card:hover{box-shadow:0 10px 30px rgba(0,0,0,.08);transform:translateY(-2px)}
#list .body{flex:1;display:flex;flex-direction:column}
#list .acts{margin-top:auto;padding-top:10px}
#list .empty{grid-column:1/-1}
@media (max-width:720px){main{padding:14px}#list{grid-template-columns:1fr;gap:14px}}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{font-size:13px;padding:7px 12px;border:0;border-radius:20px;background:#fff;color:var(--ink);cursor:pointer;border:1px solid var(--line)}
.filters button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.ph{aspect-ratio:16/10;overflow:hidden;background:linear-gradient(135deg,#dfe9e4,#f1ede4);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;position:relative}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph .n{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:10px}
.strip{display:flex;gap:4px;overflow-x:auto;padding:4px}
.strip img{height:64px;width:86px;flex:none;object-fit:cover;border-radius:6px;cursor:pointer}
.body{padding:14px 16px}
.price{font-size:22px;font-weight:700;color:var(--accent)}
.price small{font-size:13px;color:var(--muted);font-weight:400}
.t{font-size:17px;font-weight:600;margin:2px 0}
.addr{font-size:13px;color:var(--muted)}
.facts{display:flex;gap:14px;margin:8px 0;font-size:14px}
.tags{margin:6px 0}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--accent2);color:var(--accent);margin:0 4px 4px 0}
.tag.when{background:var(--warnbg);color:var(--warn)}
.tag.draft{background:#fde8e8;color:#a12b2b}
.desc{font-size:14px;margin:6px 0;white-space:pre-wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font-size:14px;padding:10px 14px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;border:0;cursor:pointer}
.btn.share{background:#fff;color:#0f6b4f;border:1px solid #b9cfc5}
.btn.ghost{background:var(--accent2);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.note{font-size:12px;color:var(--muted)}
.contact{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:none;gap:8px;justify-content:center}
footer{max-width:1240px;margin:0 auto;padding:4px 14px 30px}
</style>
</head>
<body>
<nav class="nav"><div class="in">
  <a class="logo" href="index.html"><i>好</i>好租 Howzu<small>墨尔本 · 学区 · 租房 · 投资</small></a>
  <div class="links"><a href="index.html">🏫 查学区</a><a href="rentals.html" class="on">🏠 在租房源</a><a href="invest.html">📈 投资测算</a></div>
  <a class="post" href="post.html">＋ 免费发房源</a>
</div></nav>
<header class="hero"><div class="in"><h1>在租房源</h1><p>墨尔本 CBD / Carlton 公寓，我们直接管理，中文沟通，看房、签约、维修一条龙。每套房都能一键查学区。</p></div></header>
<main>
  <div class="filters" id="filters">
    <button data-f="all" class="on">全部</button>
    <button data-f="now">马上入住</button>
    <button data-f="later">稍后入住</button>
    <button data-f="1">1 房</button>
    <button data-f="2">2 房+</button>
  </div>
  <div id="list"><div class="empty">加载中…</div></div>
  <p class="note">房源信息以签约时为准。租约使用维州 CAV 标准租赁合同，押金存入 RTBA（维州租房押金管理局）。</p>
</main>
<div class="contact" id="contactBar"></div>
<footer class="note">好租 Howzu · Cendant Property 管理</footer>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="js/share.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const preview=new URLSearchParams(location.search).has("preview");
let L=[],C={},F="all";
const isNow=x=>/尽快|马上|即|now/i.test(x.available||"");
function card(x){
  const ph=x.photos&&x.photos.length?`<img src="${esc(x.photos[0])}" alt="${esc(x.title)}" loading="lazy"><span class="n">${x.photos.length} 张</span>`:"照片整理中";
  const strip=x.photos&&x.photos.length>1?`<div class="strip">${x.photos.slice(1).map(p=>`<img src="${esc(p)}" loading="lazy" onclick="this.closest('.card').querySelector('.ph img').src=this.src">`).join("")}</div>`:"";
  const price=x.rentWeekly?`$${x.rentWeekly}<small> / 周</small>`:`<small>租金面议</small>`;
  const f=[x.beds!=null?`🛏 ${x.beds} 房`:"",x.baths!=null?`🛁 ${x.baths} 卫`:"",x.cars!=null?`🚗 ${x.cars?x.cars+" 车位":"无车位"}`:""].filter(Boolean).join("　");
  const msg=encodeURIComponent(`你好，我在好租 Howzu 看到房源：${x.title}`);
  const tel=x.phone||C.phone, wx=x.wechat||C.wechat;
  const contact=(tel?`<a class="btn" href="sms:${esc(tel)}?&body=${msg}">💬 发短信</a><a class="btn ghost" href="tel:${esc(tel)}">📞 打电话</a>`:"")+(wx?`<button class="btn ghost" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(wx)}');this.textContent='已复制微信号 ${esc(wx)}'">微信：${esc(wx)}</button>`:"");
  return `<div class="card" id="L-${esc(x.id)}"><div class="ph">${ph}</div>${strip}<div class="body">
    <div class="price">${price}</div><div class="t">${esc(x.title)}</div><div class="addr">${esc(x.address)}</div>
    ${f?`<div class="facts">${f}</div>`:""}
    <div class="tags"><span class="tag when">${isNow(x)?"🔑 ":"📅 "}${esc(x.available||"")}入住</span>${x.furnished===true?'<span class="tag">带家具</span>':x.furnished===false?'<span class="tag">不带家具</span>':""}${(x.highlights||[]).map(h=>`<span class="tag">${esc(h)}</span>`).join("")}${x.status!=="live"?'<span class="tag draft">草稿·未公开</span>':""}</div>
    ${x.desc?`<div class="desc">${esc(x.desc)}</div>`:""}
    <div class="acts">${contact}<a class="btn ghost" href="index.html?q=${encodeURIComponent(x.address)}">🏫 看学区</a><button class="btn share" data-share="${esc(x.id)}">📤 分享</button></div>
  </div></div>`;
}
const one=new URLSearchParams(location.search).get("id");
function render(){
  let list=L.filter(x=>preview||x.status==="live"||x.id===one);
  if(one&&list.some(x=>x.id===one)){list=list.filter(x=>x.id===one);document.querySelector("#filters").innerHTML='<a href="rentals.html" style="color:#0f6b4f;font-weight:600">‹ 查看全部房源</a>';}
  list=list.filter(x=>F==="all"||(F==="now"&&isNow(x))||(F==="later"&&!isNow(x))||(F==="1"&&x.beds===1)||(F==="2"&&x.beds>=2));
  $("#list").innerHTML=list.length?list.map(card).join(""):`<div class="empty">暂时没有符合条件的房源。<br>想第一时间收到新房源？在<a href="index.html#leadCard">学区页</a>留下需求。</div>`;
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-share]");if(!b)return;const x=L.find(y=>String(y.id)===b.dataset.share);if(x&&window.HowzuShare)HowzuShare.open(x);});
$("#filters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;F=b.dataset.f;document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("on",x===b));render();});
const hideUnit=a=>String(a||"").replace(/^\s*[\w-]+\s*\/\s*/,"");
async function userListings(){
  const H=window.HOWZU||{}; if(!H.SUPABASE_URL) return [];
  try{
    const r=await fetch(`${H.SUPABASE_URL}/rest/v1/listings?status=eq.live&order=created_at.desc&limit=200`,{headers:{apikey:H.SUPABASE_ANON_KEY}});
    const rows=r.ok?await r.json():[];
    return rows.map(x=>({id:x.id,status:"live",title:x.title,address:hideUnit(x.address),suburb:x.suburb,beds:x.beds,baths:x.baths,cars:x.cars,rentWeekly:x.rent_weekly,available:x.available,furnished:x.furnished==="带家具"?true:x.furnished==="不带家具"?false:null,photos:x.photos||[],highlights:x.highlights||[],desc:x.description,phone:x.contact_phone,wechat:x.contact_wechat,user:true}));
  }catch(_){return []}
}
Promise.all([fetch("data/listings.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>({})),userListings()]).then(([j,u])=>{L=[...(j.listings||[]),...u];C=j.contact||{};render();});
</script>
</body>
</html>
