<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>好租 Howzu · 墨尔本在租房源</title>
<meta name="description" content="好租 Howzu 墨尔本在租房源：CBD、Carlton 公寓，房东直租管理，中文服务。每套房一键查对口学区。">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2321;--muted:#6b726f;--line:#e4e1d8;--accent:#0f6b4f;--accent2:#e8f3ee;--warn:#9a5b00;--warnbg:#fff6e5}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{background:var(--accent);color:#fff;padding:22px 18px 18px}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;opacity:.9;font-size:14px}
header a{color:#fff;font-weight:600}
main{max-width:760px;margin:0 auto;padding:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{font-size:13px;padding:7px 12px;border:0;border-radius:20px;background:#fff;color:var(--ink);cursor:pointer;border:1px solid var(--line)}
.filters button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.ph{aspect-ratio:16/10;background:linear-gradient(135deg,#dfe9e4,#f1ede4);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .n{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:10px}
.strip{display:flex;gap:4px;overflow-x:auto;padding:4px}
.strip img{height:64px;border-radius:6px;cursor:pointer}
.body{padding:14px 16px}
.price{font-size:22px;font-weight:700;color:var(--accent)}
.price small{font-size:13px;color:var(--muted);font-weight:400}
.t{font-size:17px;font-weight:600;margin:2px 0}
.addr{font-size:13px;color:var(--muted)}
.facts{display:flex;gap:14px;margin:8px 0;font-size:14px}
.tags{margin:6px 0}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--accent2);color:var(--accent);margin:0 4px 4px 0}
.tag.when{background:var(--warnbg);color:var(--warn)}
.tag.draft{background:#fde8e8;color:#a12b2b}
.desc{font-size:14px;margin:6px 0;white-space:pre-wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font-size:14px;padding:10px 14px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;border:0;cursor:pointer}
.btn.ghost{background:var(--accent2);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.note{font-size:12px;color:var(--muted)}
.contact{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:none;gap:8px;justify-content:center}
footer{max-width:760px;margin:0 auto;padding:4px 14px 30px}
</style>
</head>
<body>
<header>
  <h1>好租 Howzu · 在租房源</h1>
  <p>墨尔本 CBD / Carlton 公寓，我们直接管理，中文沟通，看房、签约、维修一条龙。</p>
  <p style="margin-top:8px"><a href="index.html">🏫 查学区 ›</a>　<a href="invest.html">📈 投资测算 ›</a></p>
</header>
<main>
  <div class="filters" id="filters">
    <button data-f="all" class="on">全部</button>
    <button data-f="now">马上入住</button>
    <button data-f="later">稍后入住</button>
    <button data-f="1">1 房</button>
    <button data-f="2">2 房+</button>
  </div>
  <div id="list"><div class="empty">加载中…</div></div>
  <p class="note">房源信息以签约时为准。租约使用维州 CAV 标准租赁合同，押金存入 RTBA（维州租房押金管理局）。</p>
</main>
<div class="contact" id="contactBar"></div>
<footer class="note">好租 Howzu · Cendant Property 管理</footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const preview=new URLSearchParams(location.search).has("preview");
let L=[],C={},F="all";
const isNow=x=>/尽快|马上|即|now/i.test(x.available||"");
function card(x){
  const ph=x.photos&&x.photos.length?`<img src="${esc(x.photos[0])}" alt="${esc(x.title)}" loading="lazy"><span class="n">${x.photos.length} 张</span>`:"照片整理中";
  const strip=x.photos&&x.photos.length>1?`<div class="strip">${x.photos.slice(1).map(p=>`<img src="${esc(p)}" loading="lazy" onclick="this.closest('.card').querySelector('.ph img').src=this.src">`).join("")}</div>`:"";
  const price=x.rentWeekly?`$${x.rentWeekly}<small> / 周</small>`:`<small>租金面议</small>`;
  const f=[x.beds!=null?`🛏 ${x.beds} 房`:"",x.baths!=null?`🛁 ${x.baths} 卫`:"",x.cars!=null?`🚗 ${x.cars?x.cars+" 车位":"无车位"}`:""].filter(Boolean).join("　");
  const msg=encodeURIComponent(`你好，我想咨询好租房源：${x.title}（${x.address}）`);
  const contact=C.phone?`<a class="btn" href="sms:${esc(C.phone)}?&body=${msg}">💬 发短信咨询</a><a class="btn ghost" href="tel:${esc(C.phone)}">📞 打电话</a>`:"";
  return `<div class="card"><div class="ph">${ph}</div>${strip}<div class="body">
    <div class="price">${price}</div><div class="t">${esc(x.title)}</div><div class="addr">${esc(x.address)}</div>
    ${f?`<div class="facts">${f}</div>`:""}
    <div class="tags"><span class="tag when">${isNow(x)?"🔑 ":"📅 "}${esc(x.available||"")}入住</span>${x.furnished===true?'<span class="tag">带家具</span>':x.furnished===false?'<span class="tag">不带家具</span>':""}${(x.highlights||[]).map(h=>`<span class="tag">${esc(h)}</span>`).join("")}${x.status!=="live"?'<span class="tag draft">草稿·未公开</span>':""}</div>
    ${x.desc?`<div class="desc">${esc(x.desc)}</div>`:""}
    <div class="acts">${contact}<a class="btn ghost" href="index.html?q=${encodeURIComponent(x.address)}">🏫 看这套房的学区</a></div>
  </div></div>`;
}
function render(){
  const list=L.filter(x=>preview||x.status==="live").filter(x=>F==="all"||(F==="now"&&isNow(x))||(F==="later"&&!isNow(x))||(F==="1"&&x.beds===1)||(F==="2"&&x.beds>=2));
  $("#list").innerHTML=list.length?list.map(card).join(""):`<div class="empty">暂时没有符合条件的房源。<br>想第一时间收到新房源？在<a href="index.html#leadCard">学区页</a>留下需求。</div>`;
}
$("#filters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;F=b.dataset.f;document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("on",x===b));render();});
fetch("data/listings.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{L=j.listings||[];C=j.contact||{};render();}).catch(()=>{$("#list").innerHTML='<div class="empty">房源加载失败，请刷新。</div>'});
</script>
</body>
</html>
