<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>内部工作台 · 好租 Howzu</title>
<link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="icon" href="/icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0f6b4f">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2321;--muted:#6b726f;--line:#e6e2d8;--accent:#0f6b4f;--accent2:#e8f3ee;--warn:#8a5a00;--warnbg:#fff4e0;--bad:#a12b2b;--badbg:#fde8e8;--blue:#1c4e80;--bluebg:#e7eef7}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
header{background:var(--accent);color:#fff;position:sticky;top:0;z-index:5}
.hd{max-width:1280px;margin:0 auto;padding:12px clamp(12px,3vw,32px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hd h1{margin:0;font-size:18px;font-weight:700;white-space:nowrap}
.hd h1 small{font-weight:400;opacity:.75;font-size:12px;margin-left:6px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav button{background:transparent;border:0;color:#fff;opacity:.75;font-size:14px;padding:8px 12px;border-radius:18px;cursor:pointer;white-space:nowrap}
nav button.on{background:rgba(255,255,255,.18);opacity:1;font-weight:600}
.who{font-size:12px;opacity:.8;white-space:nowrap}
.who button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:12px;padding:2px 8px;margin-left:6px;cursor:pointer}
main{max-width:1280px;margin:0 auto;padding:16px clamp(12px,3vw,32px) 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.card h3 .c{color:var(--muted);font-weight:400;font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #f1eee6;font-size:14px;align-items:center}
.row:first-of-type{border-top:0}
.row .r{color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}
.row a,.lnk{color:var(--accent);cursor:pointer;text-decoration:none}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0}
.bar .n{width:110px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .b{height:10px;border-radius:5px;background:var(--accent);opacity:.85}
.bar .t{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{font-size:13px;padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tools input{flex:1;min-width:160px;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:18px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:box-shadow .15s}
.p:hover{box-shadow:0 4px 18px rgba(0,0,0,.07)}
.p .ph{aspect-ratio:16/9;background:#e9e6de center/cover no-repeat;position:relative}
.p .ph .pubb{position:absolute;left:8px;top:8px}
.p .bd{padding:10px 12px}
.p .ad{font-weight:600;font-size:15px}
.p .mt{font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tg{font-size:11.5px;padding:2px 8px;border-radius:10px;background:#f1eee6;color:#555;white-space:nowrap}
.tg.ok{background:var(--accent2);color:var(--accent)}.tg.warn{background:var(--warnbg);color:var(--warn)}.tg.bad{background:var(--badbg);color:var(--bad);font-weight:600}.tg.blue{background:var(--bluebg);color:var(--blue)}
.empty{text-align:center;color:var(--muted);padding:40px}
/* 抽屉 */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
.ov.on{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:21;overflow-y:auto;transform:translateX(100%);transition:transform .2s}
.dr.on{transform:none}
.dr .top{position:sticky;top:0;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;z-index:2}
.dr .top b{flex:1;font-size:16px}
.dr .x{border:0;background:#fff;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.dr .in{padding:14px 16px 90px}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.sec h4{margin:0 0 8px;font-size:14px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
label.l{font-size:12px;color:var(--muted);display:block}
.f input,.f select,textarea{width:100%;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-family:inherit}
textarea{min-height:180px;line-height:1.55}
.fl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.fl .k{color:var(--muted);white-space:nowrap}
.phs{display:flex;gap:6px;flex-wrap:wrap}
.phs .it{position:relative;width:104px}
.phs img{width:104px;height:78px;object-fit:cover;border-radius:8px;display:block}
.phs .it .ctl{display:flex;justify-content:space-between;margin-top:2px}
.phs .it button{border:0;background:#f1eee6;border-radius:6px;font-size:12px;padding:2px 6px;cursor:pointer}
.phs .it .cv{position:absolute;left:4px;top:4px;background:var(--accent);color:#fff;font-size:11px;padding:0 6px;border-radius:8px}
.addph{width:104px;height:78px;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;font-size:13px;text-align:center}
.bbar{position:fixed;bottom:0;right:0;width:min(640px,100%);background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;z-index:22;transform:translateX(100%);transition:transform .2s}
.bbar.on{transform:none}
.btn{font-size:14px;padding:9px 14px;border-radius:10px;border:0;cursor:pointer;background:var(--accent2);color:var(--accent);font-weight:600}
.btn.pri{background:var(--accent);color:#fff}.btn.bad{background:var(--badbg);color:var(--bad)}
.btn:disabled{opacity:.5}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1d2321;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:40;display:none}
.login{max-width:420px;margin:60px auto}
.login input{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0}
@media (max-width:700px){.kpi .v{font-size:22px}.hd h1 small{display:none}.hd{gap:6px}nav{order:3;flex-basis:100%;margin:0 -6px}.who .em{display:none}.who{margin-left:auto}}
.ext{position:relative;display:inline-block;margin-left:6px}.ext summary{list-style:none;cursor:pointer;color:#fff;font-weight:600;padding:6px 10px;border-radius:14px}.ext summary::-webkit-details-marker{display:none}.ext[open] summary{background:rgba(255,255,255,.18)}.ext>div{position:absolute;right:0;top:110%;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;min-width:200px;z-index:60}.ext a{display:block;padding:8px 10px;border-radius:8px;color:#1d2321;text-decoration:none;font-size:14px;white-space:nowrap}.ext a:hover{background:#eef5f1}
</style>
</head>
<body>
<header><div class="hd"><h1>好租 · 内部工作台<small>只限公司员工</small></h1><nav id="nav"></nav><div class="who" id="who"></div></div></header>
<main id="app"><div class="empty">加载中…</div></main>
<div class="ov" id="ov"></div><div class="dr" id="dr"></div><div class="bbar" id="bbar"></div><div class="toast" id="toast"></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import "./js/config.js";
import { stats, propTags, money, fmtDate, daysBetween, weekly, wechatText, xhsText, yeeyiText, fbText } from "./js/work-core.js?v=20261110d";
const H = window.HOWZU || {}; const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sb = createClient(H.SUPABASE_URL, H.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
window.HOWZU_SB = sb; // 给 tracker 同步脚本用（js/work-sync.js）
const PUBLIC_IMG = p => /^https?:|^data:/.test(p) ? p : "/" + String(p).replace(/^\//, "");
let ALL = [], P = [], tab = (["stats", "props", "review", "staff"].includes(new URLSearchParams(location.search).get("tab")) ? new URLSearchParams(location.search).get("tab") : "stats"), filt = "all", q = "", cur = null, me = "", SUPER = false, MY = [], ORGS = [], org = "all";
const canWrite = o => SUPER || MY.some(m => m.org_id === o && m.role !== "viewer");
const toast = t => { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = "none", 2200); };
const tabs = () => [["stats", "📊 统计"], ["props", "🏠 房源"], ...(SUPER ? [["review", "📝 用户发布审核"], ["staff", "👥 账号与区块"]] : [])];

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  me = session.user.email;
  $("#who").innerHTML = `<span class="em">${esc(me)}</span><button id="setpw">设置密码</button><button id="out">退出</button>`;
  $("#setpw").onclick = () => setPassword();
  $("#out").onclick = async () => { await sb.auth.signOut(); location.reload(); };
  const [{ data: sa }, { data: mm }, { data: oo }] = await Promise.all([sb.from("super_admins").select("email"), sb.from("members").select("*"), sb.from("orgs").select("*").order("created_at")]);
  SUPER = (sa || []).some(x => x.email === me.toLowerCase()); MY = (mm || []).filter(m => m.email === me.toLowerCase()); ORGS = oo || [];
  if (!SUPER && !MY.length) return showPending();
  await loadProps();
}
const pwField = (id, ph, ac) => `<div style="position:relative"><input id="${id}" type="password" autocomplete="${ac}" placeholder="${ph}" style="padding-right:56px"><button type="button" class="pweye" data-for="${id}" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted,#6b726f);font-size:13px;padding:6px;cursor:pointer">显示</button></div>`;
document.addEventListener("click", e => { const b = e.target.closest(".pweye"); if (!b) return; const i = document.getElementById(b.dataset.for); const show = i.type === "password"; i.type = show ? "text" : "password"; b.textContent = show ? "隐藏" : "显示"; });
function showLogin(mode = "login") {
  $("#nav").innerHTML = "";
  const em = esc(localStorage.getItem("howzu-em") || H.ADMIN_EMAIL || "");
  if (mode === "forgot") {
    $("#app").innerHTML = `<div class="card login"><h3>找回密码</h3><p class="small muted">输入登录邮箱，我们会发一封重设密码的邮件。点邮件里的链接回到这里，就能设新密码。</p>
    <input id="em" type="email" autocomplete="username" placeholder="邮箱" value="${em}">
    <button class="btn pri" id="go" style="width:100%">发重设密码邮件</button><p class="small muted" id="msg"></p>
    <p class="small"><a href="#" id="back">← 返回登录</a></p></div>`;
    $("#back").onclick = e => { e.preventDefault(); showLogin(); };
    $("#go").onclick = async () => { const email = $("#em").value.trim(); if (!email) return $("#msg").textContent = "请填邮箱";
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0].split("?")[0] });
      $("#msg").textContent = error ? "失败：" + error.message : "已发送。去邮箱点链接（几分钟内没收到看看垃圾邮件）。"; };
    return;
  }
  $("#app").innerHTML = `<div class="card login"><h3>员工登录</h3>
  <input id="em" type="email" autocomplete="username" placeholder="邮箱" value="${em}">
  ${pwField("pw", "密码", "current-password")}
  <button class="btn pri" id="go" style="width:100%">登录</button>
  <p class="small muted" id="msg"></p>
  <p class="small" style="display:flex;justify-content:space-between;gap:8px;margin-top:10px"><a href="#" id="forgot">忘记密码？</a><a href="#" id="signup">没有账号？申请开通</a></p></div>`;
  const go = async () => { const email = $("#em").value.trim(), password = $("#pw").value; if (!email || !password) return $("#msg").textContent = "请填邮箱和密码";
    $("#msg").textContent = "登录中…"; const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { $("#msg").textContent = /Invalid login/i.test(error.message) ? "邮箱或密码不对。忘了密码点「忘记密码？」；还没有账号点「申请开通」。" : /confirm/i.test(error.message) ? "账号还没激活：请先点确认邮件（或邀请邮件）里的链接。" : "失败：" + error.message; return; }
    try { localStorage.setItem("howzu-em", email); } catch (_) {} location.reload(); };
  $("#go").onclick = go; $("#pw").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  $("#forgot").onclick = e => { e.preventDefault(); showLogin("forgot"); };
  $("#signup").onclick = e => { e.preventDefault(); showSignup(); };
}
// 已登录但还没被批准：提交 / 显示申请，什么内部资料都看不到（数据库规则也不给）
async function showPending() {
  $("#nav").innerHTML = "";
  let pre = {}; try { pre = JSON.parse(localStorage.getItem("howzu-req") || "{}"); } catch (_) {}
  const { data: mine } = await sb.from("access_requests").select("*").eq("email", me.toLowerCase()).maybeSingle();
  if (!mine && (pre.name || pre.note)) { await sb.from("access_requests").upsert({ email: me.toLowerCase(), name: pre.name || null, note: pre.note || null }); try { localStorage.removeItem("howzu-req"); } catch (_) {} return showPending(); }
  $("#app").innerHTML = mine ? `<div class="card login"><h3>⏳ 已提交申请，等管理员批准</h3><p class="muted">${esc(me)}${mine.name ? "（" + esc(mine.name) + "）" : ""} 的申请已经收到。管理员批准后，重新打开这个页面就能看到你负责的房源。</p><p class="small muted">在批准之前，这个账号看不到任何内部资料。</p></div>`
    : `<div class="card login"><h3>申请开通工作台</h3><p class="small muted">${esc(me)} 还不在员工名单里。填一下称呼和说明，管理员批准后才能进入。</p>
      <input id="rq_nm" placeholder="称呼，如 王先生 / 合作方 A" maxlength="40"><textarea id="rq_nt" placeholder="说明（可选）：你是谁、要看哪些房源" maxlength="300" style="min-height:70px"></textarea>
      <button class="btn pri" id="rq_go" style="width:100%">提交申请</button><p class="small muted" id="rq_m"></p></div>`;
  const b = $("#rq_go"); if (b) b.onclick = async () => { const { error } = await sb.from("access_requests").upsert({ email: me.toLowerCase(), name: $("#rq_nm").value.trim() || null, note: $("#rq_nt").value.trim() || null }); if (error) $("#rq_m").textContent = "提交失败：" + error.message; else showPending(); };
}
function showSignup() {
  $("#nav").innerHTML = "";
  $("#app").innerHTML = `<div class="card login"><h3>申请工作台账号</h3><p class="small muted">注册后要经过管理员批准，才能看到内部资料。</p>
  <input id="em" type="email" autocomplete="username" placeholder="邮箱">
  ${pwField("pw", "设置密码（至少 8 位）", "new-password")}
  <input id="rq_nm" placeholder="称呼，如 王先生 / 合作方 A" maxlength="40">
  <textarea id="rq_nt" placeholder="说明（可选）：你是谁、要看哪些房源" maxlength="300" style="min-height:70px"></textarea>
  <button class="btn pri" id="go" style="width:100%">注册并提交申请</button><p class="small muted" id="msg"></p>
  <p class="small"><a href="#" id="back">← 已有账号，去登录</a></p></div>`;
  $("#back").onclick = e => { e.preventDefault(); showLogin(); };
  $("#go").onclick = async () => { const email = $("#em").value.trim().toLowerCase(), password = $("#pw").value;
    if (!/^\S+@\S+\.\S+$/.test(email)) return $("#msg").textContent = "邮箱格式不对"; if (password.length < 8) return $("#msg").textContent = "密码至少 8 位";
    try { localStorage.setItem("howzu-req", JSON.stringify({ name: $("#rq_nm").value.trim(), note: $("#rq_nt").value.trim() })); localStorage.setItem("howzu-em", email); } catch (_) {}
    $("#msg").textContent = "提交中…"; const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.href.split("#")[0].split("?")[0] } });
    if (error) return $("#msg").textContent = "注册失败：" + error.message;
    if (data.session) return location.reload();
    $("#app").innerHTML = `<div class="card login"><h3>📧 请去邮箱确认</h3><p class="muted">我们给 ${esc(email)} 发了一封确认邮件。点邮件里的链接回到这里登录，申请就会自动交给管理员。</p><p class="small muted">管理员批准之前，看不到任何内部资料。</p></div>`; };
}
function setPassword(title = "设置密码", after) {
  const d = document.createElement("div");
  d.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px";
  d.innerHTML = `<div class="card login" style="margin:0;width:100%"><h3>${title}</h3><p class="small muted">至少 8 位，建议字母加数字。</p>${pwField("np1", "新密码", "new-password")}${pwField("np2", "再输一次", "new-password")}<p class="small muted" id="npm"></p><button class="btn pri" id="npok">保存</button> <button class="btn" id="npx">取消</button></div>`;
  document.body.appendChild(d);
  d.querySelector("#npx").onclick = () => d.remove();
  d.querySelector("#npok").onclick = async () => { const a = d.querySelector("#np1").value, b = d.querySelector("#np2").value, m = d.querySelector("#npm");
    if (a.length < 8) return m.textContent = "至少 8 位"; if (a !== b) return m.textContent = "两次不一样";
    m.textContent = "保存中…"; const { error } = await sb.auth.updateUser({ password: a }); if (error) return m.textContent = "没设成功：" + error.message;
    d.remove(); toast("密码已设置，以后用邮箱 + 密码登录"); if (after) after(); };
}
async function loadProps() {
  const { data, error } = await sb.from("internal_props").select("*").order("id");
  if (error) { $("#app").innerHTML = `<div class="empty">读取失败：${esc(error.message)}<br><span class="small">如果是"relation does not exist"，说明数据库还没建内部表（supabase/internal.sql）。</span></div>`; return; }
  if (!data.length) { $("#app").innerHTML = `<div class="empty">看不到任何内部房源。<br>可能你的邮箱（${esc(me)}）还不在员工名单里，请让管理员在「员工」里加上你。</div>`; renderNav(); return; }
  ALL = data; applyOrg(); render();
}
function applyOrg() { P = org === "all" ? ALL : ALL.filter(p => p.org_id === org); }
function renderNav() {
  const seen = [...new Set(ALL.map(p => p.org_id))];

    const blob = await compress(f), path = `internal/${cur.id}/${Date.now()}-${Math.random().toString(36).slice(2, 6)}.jpg`;
    const { error } = await sb.storage.from(H.BUCKET || "listing-photos").upload(path, blob, { contentType: "image/jpeg" });
    if (error) { toast("上传失败：" + error.message); return; }
    (cur.pub.photos = cur.pub.photos || []).push(sb.storage.from(H.BUCKET || "listing-photos").getPublicUrl(path).data.publicUrl);
    drawPhotos();
  }
  toast("上传好了，记得点保存");
}

  const load = async () => { const { data, error } = await sb.from("members").select("*").order("added_at"); $("#ml").innerHTML = error ? esc(error.message) : (data.length ? data.map(m => `<div class="row"><span>${esc(m.name || "")} <span class="muted">${esc(m.email)}</span></span><span class="r">${esc((ORGS.find(o => o.id === m.org_id) || {}).name || m.org_id)} · ${m.role} · <a data-rmmem="${esc(m.email)}|${esc(m.org_id)}">移除</a></span></div>`).join("") : '<div class="muted small">还没有其他成员，只有你。</div>'); };
  const loadReq = async () => { const { data, error } = await sb.from("access_requests").select("*").order("created_at");
    if (error) { $("#rql").innerHTML = `<span class="small muted">还没开通申请功能：在 Supabase 运行一次 supabase/access_requests.sql。</span>`; return; }
    $("#rql").innerHTML = data.length ? data.map(r => `<div class="row" style="flex-wrap:wrap;gap:6px"><span><b>${esc(r.name || "（没填称呼）")}</b> <span class="muted">${esc(r.email)}</span>${r.note ? `<br><span class="small muted">${esc(r.note)}</span>` : ""}<br><span class="small muted">${new Date(r.created_at).toLocaleString("zh-CN")}</span></span>
      <span class="r" style="display:flex;gap:6px;align-items:center"><select class="chip" data-rqorg="${esc(r.email)}">${ORGS.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select><select class="chip" data-rqrole="${esc(r.email)}"><option value="viewer">viewer 只看</option><option value="staff">staff 可改</option></select><button class="btn pri" data-rqok="${esc(r.email)}">批准</button><button class="btn bad" data-rqno="${esc(r.email)}">拒绝</button></span></div>`).join("") : '<span class="small muted">暂时没有申请。别人在工作台登录页点「申请开通」注册后，会出现在这里。</span>';
    $("#rql").querySelectorAll("[data-rqok]").forEach(b => b.onclick = async () => { const em = b.dataset.rqok, r = data.find(x => x.email === em);
      const org_id = $(`[data-rqorg="${CSS.escape(em)}"]`).value, role = $(`[data-rqrole="${CSS.escape(em)}"]`).value;
      const { error } = await sb.from("members").insert({ email: em, org_id, role, name: (r && r.name) || null }); if (error) return toast(error.message);

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-filt],[data-open],[data-close],[data-act],[data-mv],[data-rm],#add,#ov,[data-rmmem]"); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); }
  else if (t.dataset.filt) { filt = t.dataset.filt; renderProps(); }
  else if (t.dataset.open) openProp(t.dataset.open);
  else if (t.hasAttribute("data-close") || t.id === "ov") closeDr();
  else if (t.id === "add") { $("#file").onchange = ev => upload([...ev.target.files]); $("#file").click(); }
  else if (t.dataset.mv) { const i = +t.dataset.mv, j = i + +t.dataset.d, a = cur.pub.photos; if (j >= 0 && j < a.length) { [a[i], a[j]] = [a[j], a[i]]; drawPhotos(); } }
  else if (t.dataset.rm) { cur.pub.photos.splice(+t.dataset.rm, 1); drawPhotos(); }
  else if (t.dataset.rmmem) { const [em, o] = t.dataset.rmmem.split("|"); if (confirm("移除 " + em + "？")) { await sb.from("members").delete().eq("email", em).eq("org_id", o); renderStaff(); } }
  else if (t.dataset.act) {
    const a = t.dataset.act; t.disabled = true;
    if (a === "save") { if (await save()) { render(); openProp(cur.id); } }
    if (a === "live" || a === "let") { collect(); cur.pub.status = a; if (await save({ published: true })) { render(); openProp(cur.id); toast(a === "live" ? "已发布到对外页面（在租）" : "已发布为已租出展示"); } }
    if (a === "unpub" && confirm("从对外页面下架？内部数据不会删。")) { if (await save({ published: false })) { render(); openProp(cur.id); } }
    if (a === "preview") { collect(); const id = String(cur.pub_id || cur.id); try { localStorage.setItem("howzu-draft", JSON.stringify({ ...cur.pub, id, status: cur.pub.status === "let" ? "let" : "live" })); } catch (_) {} window.open("rentals.html?draft=1&id=" + encodeURIComponent(id), "_blank"); }
    if (a === "wechat") { collect(); try { await navigator.clipboard.writeText(wechatText(cur.pub, location.origin + "/rentals.html?id=" + encodeURIComponent(cur.pub_id || cur.id))); toast("已复制，去微信粘贴"); } catch (_) { toast("复制失败，请手动复制"); } }
    t.disabled = false;
  }
});
async function genPoster() {
  collect(); const u = cur.pub, cv = $("#gen_cv"), x = cv.getContext("2d"); cv.style.display = "block";
  x.fillStyle = "#0d1b3d"; x.fillRect(0, 0, 1080, 1440);
  const src = (u.photos || [])[0];
  if (src) { await new Promise(res => { const im = new Image(); im.crossOrigin = "anonymous"; im.onload = () => { const r = Math.max(1080 / im.width, 900 / im.height), w = im.width * r, h = im.height * r; x.drawImage(im, (1080 - w) / 2, (900 - h) / 2, w, h); res(); }; im.onerror = res; im.src = PUBLIC_IMG(src); }); }
  const g = x.createLinearGradient(0, 600, 0, 900); g.addColorStop(0, "rgba(13,27,61,0)"); g.addColorStop(1, "rgba(13,27,61,1)"); x.fillStyle = g; x.fillRect(0, 600, 1080, 300);
  x.fillStyle = "#ffd166"; x.font = "bold 40px sans-serif"; x.fillText("好租 Howzu · 墨尔本租房", 70, 960);
  x.fillStyle = "#fff"; x.font = "900 64px sans-serif"; const t = u.title || "好租房源"; x.fillText(t.length > 15 ? t.slice(0, 15) + "…" : t, 70, 1050);
  x.font = "bold 56px sans-serif"; x.fillStyle = "#ffd166"; x.fillText(u.rentWeekly ? `$${u.rentWeekly}/周` : "租金私信咨询", 70, 1150);
  x.fillStyle = "#d6defa"; x.font = "40px sans-serif"; x.fillText([u.suburb, u.beds != null ? `${u.beds}房${u.baths ?? "?"}卫` : "", u.available ? u.available + "入住" : ""].filter(Boolean).join(" · "), 70, 1230);
  if ((u.highlights || []).length) { x.font = "34px sans-serif"; x.fillText("✨ " + u.highlights.slice(0, 3).join(" / ").slice(0, 34), 70, 1300); }
  if (cur._geo && (cur._geo.s || cur._geo.p)) { x.fillStyle = "#d6defa"; x.font = "30px sans-serif"; x.fillText(("🏫 对口 " + [cur._geo.s, cur._geo.p].filter(Boolean).map(n => n.replace(/ Secondary College$/, " SC").replace(/ High School$/, " High").replace(/ Primary School$/, " PS")).join(" · ")).slice(0, 52), 70, 1345); }
  x.fillStyle = "#9fb6ff"; x.font = "30px sans-serif"; x.fillText("howzu.com.au", 70, 1380);
  try { const a = document.createElement("a"); a.download = (cur.pub_id || cur.id) + "-海报.png"; a.href = cv.toDataURL("image/png"); a.click(); $("#gen_tip").textContent = "海报已下载"; }
  catch (_) { $("#gen_tip").textContent = "照片跨域，海报只能在页面上长按/右键保存"; }
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-gen]"); if (!b || !cur) return; const k = b.dataset.gen;
  if (k === "copy") { try { await navigator.clipboard.writeText($("#gen_out").value); $("#gen_tip").textContent = "已复制"; } catch (_) { $("#gen_tip").textContent = "复制失败，请手动选中复制"; } return; }

// 创作室：按地址查对口公立学校（2027 学区）和到各大学的通勤，加到文案末尾——中文租客最看重的卖点
async function addGeo() {
  collect(); const tip = $("#gen_tip"), addr = (cur.pub.address || cur.addr || "").replace(/^\s*[\w-]+\s*\/\s*/, "");
  if (!addr) return tip.textContent = "没有地址"; tip.textContent = "查学区和通勤中…";
  try {
    if (!window.HowzuCommute) await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "js/commute.js?v=20261113"; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
    const q = /vic|victoria|\b3\d{3}\b/i.test(addr) ? addr : addr + ", Victoria";
    const g = await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=au&q=" + encodeURIComponent(q)).then(r => r.json());
    if (!g[0]) return tip.textContent = "地址定位不到，换个写法试试";
    const pt = { lat: +g[0].lat, lng: +g[0].lon }, C = window.HowzuCommute;
    const [zp, zs] = await (window.ZP = window.ZP || Promise.all(["zones_primary", "zones_secondary"].map(n => fetch("data/" + n + ".json").then(r => r.json()))));
    const P = C.zonesAt(zp, pt), S = C.zonesAt(zs, pt), R = C.rows(pt);
    const L = [];
    if (S.length || P.length) L.push("🏫 对口公立学校（2027 学区）：" + [...S.map(z => z.name + "（中学）"), ...P.map(z => z.name + "（小学）")].join("、"));
    if (R.length) L.push("🚆 通勤：" + R.map(r => `${r.name} ${r.mode === "walk" ? "步行" : "公交"}约 ${r.min} 分钟`).join(" · "));
    cur._geo = { s: (S[0] || {}).name || "", p: (P[0] || {}).name || "" };
    if (!L.length) return tip.textContent = "这个地址查不到学区和通勤";
    const o = $("#gen_out"), v = o.value.replace(/\s+$/, ""), i = v.search(/\n#\S/); // 小红书话题标签放最后，学区通勤插在标签前面
    o.value = !v ? L.join("\n") : i >= 0 ? v.slice(0, i) + "\n" + L.join("\n") + "\n" + v.slice(i) : v + "\n\n" + L.join("\n");
    tip.textContent = "已加进文案（学区以 Find my School 为准，通勤为直线估算）";
  } catch (_) { tip.textContent = "查询失败，请稍后再试"; }
}
