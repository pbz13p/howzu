name: Fetch listing photos (one-off)
on:
  workflow_dispatch: {}
  push:
    paths: [scripts/airbnb_photos.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p tmp_airbnb
          while read -r k n url; do
            curl -sfL -A "Mozilla/5.0" -o "tmp_airbnb/$k-$n.img" "$url" || echo "fail $k-$n"
          done < scripts/airbnb_photos.txt
          pip install -q pillow
          python3 -c "
          import glob,os
          from PIL import Image
          for f in glob.glob('tmp_airbnb/*.img'):
              try:
                  im=Image.open(f).convert('RGB'); im.thumbnail((1400,1400)); im.save(f[:-4]+'.jpg',quality=82,optimize=True,progressive=True)
              except Exception as e: print('bad',f,e)
              os.remove(f)
          "
          ls tmp_airbnb | wc -l
      - name: Commit
        run: |
          git config user.name "photo-bot"; git config user.email "photo-bot@users.noreply.github.com"
          git add tmp_airbnb && git commit -m "Fetch Airbnb listing photos for selection" && git push || echo nothing
