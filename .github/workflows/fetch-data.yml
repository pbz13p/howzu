name: Fetch raw government data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-data.yml"
      - "scripts/fetch_raw.sh"
      - "scripts/build_data.py"
  schedule:
    - cron: "17 3 1 * *" # monthly, picks up new zone releases

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install mapshaper
        run: npm install -g mapshaper@0.6
      - name: Download and convert
        run: bash scripts/fetch_raw.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site data
        run: |
          pip install pandas openpyxl
          python scripts/build_data.py
      - name: Commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add raw data
          git diff --cached --quiet || git commit -m "Update raw government data"
          git push
