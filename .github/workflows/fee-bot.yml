name: Fee bot (collect school fees)

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "private_sec / public_sec / private_pri / public_pri / all"
        default: "private_sec"
      limit:
        description: "Max schools this run (0 = all)"
        default: "0"
      refresh:
        description: "Re-check schools already done (true/false)"
        default: "false"
  schedule:
    - cron: "41 2 5 11,12,1,2 *" # 5th of Nov–Feb, when new-year fee schedules come out

permissions:
  contents: write

concurrency:
  group: fee-bot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic pandas
      - name: Run fee bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/fee_bot.py --tier private_sec
            python scripts/fee_bot.py --tier public_sec
          else
            R=""; [ "${{ inputs.refresh }}" = "true" ] && R="--refresh"
            python scripts/fee_bot.py --tier "${{ inputs.tier }}" --limit "${{ inputs.limit }}" $R
          fi
      - name: Commit
        if: always()
        run: |
          git config user.name "fee-bot"
          git config user.email "fee-bot@users.noreply.github.com"
          git add data/fees.json data/fees_usage.json || true
          git diff --cached --quiet || git commit -m "Fee bot: update school fees"
          git pull --rebase -q && git push
