name: 房源页自动生成（小图、独立页、sitemap、静态房源链接）
on:
  push:
    branches: [main]
    paths: ["data/listings.json", "photos/**", "sale/**", "js/listing-page.js", "js/home-rent.js", "tools/build-listing-pages.js", "tools/build-buildings.js", "js/building-match.js", "data/clue_buildings.json", "data/osm_pois.json", "data/rent_check.json", "tools/make_thumbs.py", "guide/*.html", "tools/build-supabase-pages.js", "tools/indexnow.js"]
  schedule:
    - cron: "23 */2 * * *" # 每 2 小时：Supabase 里新上线 / 下架的房源
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: build-pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip install --quiet pillow
      - run: python3 tools/make_thumbs.py
      - run: node tools/build-listing-pages.js
      - run: node tools/build-buildings.js
      - name: Supabase 已上线房源 → 静态页（只读数据库）
        run: node tools/build-supabase-pages.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: 有变化就提交
        run: |
          git config user.name "pages-bot"; git config user.email "pages-bot@users.noreply.github.com"
          git add -A photos rent sitemap.xml index.html rentals.html guide building llms.txt data/supabase_pages.json
          git diff --cached --quiet && echo "没有变化" && exit 0
          git commit -m "自动生成房源页、小图和 sitemap"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; [ $i = 3 ] && exit 1; done
          node tools/indexnow.js HEAD~1
