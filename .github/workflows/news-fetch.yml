name: 新闻收集（每天早上）
on:
  schedule: [{ cron: "7 19 * * *" }]   # 墨尔本夏令时早上 6:07
  push: { paths: ["tools/news_fetch.py", ".github/workflows/news-fetch.yml"] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: build-pages, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/news_fetch.py
      - run: |
          git config user.name "pbz13p"; git config user.email "pbz13p@users.noreply.github.com"
          git add data/news/
          git diff --cached --quiet || (git commit -m "新闻收集：$(date -u +%F)" && git pull --rebase && git push)
