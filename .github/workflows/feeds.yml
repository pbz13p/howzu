name: 中介房源导入（REAXML）
# 每 2 小时：读 data/feeds.json 里中介的 REAXML → 写 Supabase（新增、改租金、下架改已租出）→ 转询盘 → 触发房源页构建（静态页 + IndexNow）。
# 名单为空时只花几秒，什么都不做。
on:
  schedule:
    - cron: "13 */2 * * *"   # 在 build-pages（23 分）之前
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/feeds.json", "tools/import-feed.js", "tools/forward-leads.js"]
permissions:
  contents: write
  actions: write
concurrency: { group: feeds, cancel-in-progress: false }
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 名单为空就结束
        id: chk
        run: node -e "const a=require('./data/feeds.json').agencies||[];console.log('名单里中介 '+a.length+' 家');require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'n='+a.length+'\n')"
      - name: 导入
        if: steps.chk.outputs.n != '0'
        run: node tools/import-feed.js
        env: { SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" }
      - name: 转询盘给中介（只对打开 forward 的中介）
        if: steps.chk.outputs.n != '0'
        run: node tools/forward-leads.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - name: 记账（只有数字）并触发房源页构建
        if: steps.chk.outputs.n != '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "pages-bot"; git config user.email "pages-bot@users.noreply.github.com"
          git add data/feeds-state.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "中介导入记账 [skip ci]"; git pull --rebase -q && git push -q; }
          gh api -X POST repos/${{ github.repository }}/actions/workflows/build-pages.yml/dispatches -f ref=main && echo "已触发房源页构建"
