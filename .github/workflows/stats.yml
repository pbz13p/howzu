name: 核心数字自动读数（每天）
on:
  schedule: [{ cron: "23 20 * * *" }]   # 墨尔本早上 7 点左右
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/stats.js, .github/workflows/stats.yml]
permissions: { contents: write }
concurrency: { group: build-pages, cancel-in-progress: false }
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/test-stats.js
      - run: node tools/stats.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: |
          git config user.name "pbz13p"; git config user.email "pbz13p@users.noreply.github.com"
          git add data/stats.json METRICS.md 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "核心数字自动读数：$(date -u +%F)" && git pull --rebase && git push)
